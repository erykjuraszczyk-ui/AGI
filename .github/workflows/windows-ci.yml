name: Windows CI

on:
  push:
    branches:
      - main
      - architecture/cortana-consciousness-core-v1
      - implementation/foundation-engine-v0.1.0
  pull_request:
    branches:
      - main
      - architecture/cortana-consciousness-core-v1

jobs:
  python-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,api,crypto]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check src tests
